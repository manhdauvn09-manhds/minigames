# Sodoku nginx vhost — serves the static SPA + health probe.
#
# Phase 0: Design/ is React-via-CDN (UMD + Babel standalone) — no
# build step, no backend. Phase 1 will switch to a Vite-built bundle
# and this config stays the same; only the COPY targets in the
# Dockerfile move from Design/* to dist/*.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression — saves a chunk on the React UMD bundles + Babel.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Health probe — used by docker HEALTHCHECK and ssh_deploy_subapps.py.
    # Static, fixed body so the container's "healthy" state doesn't
    # depend on the index.html shipping correctly.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Long-lived cache on the static asset trees.
    location ~* "^/(assets|src|components|styles)/" {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Generic static-asset caching for anything else versioned.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-ish fallback — index.html for "/" and any future deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Subapp-level security headers (outer host's
    # security-headers-subapps.conf snippet adds more on top).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
