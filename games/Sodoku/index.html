<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Sodoku — allin1site Mini Games</title>
  <meta name="description" content="Play Sudoku 9×9 with 5 difficulty levels, daily challenge & 2-player race on allin1site.">
  <link rel="canonical" href="https://minigames.allin1site.com/games/sodoku/">
  <meta http-equiv="refresh" content="0; url=/games/Sodoku/Sodokugame/Design/Sudoku.html">
  <style>
    :root { color-scheme: light dark; --bg:#0f172a; --fg:#f8fafc; --accent:#818cf8; }
    @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#0f172a; --accent:#4f46e5; } }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    .box{max-width:480px}
    h1{font-size:1.6rem;margin-bottom:8px}
    p{color:var(--fg);opacity:.75;margin-bottom:16px}
    a{display:inline-block;background:var(--accent);color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:700}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <h1>🔢 Sodoku</h1>
    <p><span class="spinner"></span> Loading game…</p>
    <a href="/games/Sodoku/Sodokugame/Design/Sudoku.html">Play Sodoku →</a>
  </div>
  <script>
    location.replace('/games/Sodoku/Sodokugame/Design/Sudoku.html');
  </script>
</body>
</html>
