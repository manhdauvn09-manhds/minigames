<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:var(--bg);display:flex;gap:18px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.chip{background:var(--paper-1);border:1px solid var(--border);width:72px;height:56px}
.name{font:500 11px var(--font-mono);color:var(--fg)}
.hex{font:400 10px var(--font-mono);color:var(--fg-subtle)}
</style></head><body>
<div class="col"><div class="chip" style="border-radius:var(--radius-xs)"></div><div class="name">radius-xs</div><div class="hex">2px · chips</div></div>
<div class="col"><div class="chip" style="border-radius:var(--radius-sm)"></div><div class="name">radius-sm</div><div class="hex">6px · buttons</div></div>
<div class="col"><div class="chip" style="border-radius:var(--radius-md)"></div><div class="name">radius-md</div><div class="hex">10px · cards</div></div>
<div class="col"><div class="chip" style="border-radius:var(--radius-lg)"></div><div class="name">radius-lg</div><div class="hex">14px · board</div></div>
<div class="col"><div class="chip" style="border-radius:var(--radius-full);width:56px"></div><div class="name">radius-full</div><div class="hex">stones only</div></div>
</body></html>
