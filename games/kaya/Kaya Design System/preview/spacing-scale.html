<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px}
.box{background:var(--accent-ghost);border:1px dashed var(--sumi-ring);height:24px;border-radius:3px}
.tag{font:500 11px var(--font-mono);color:var(--fg-subtle);width:72px;flex:none}
.val{font:500 11px var(--font-mono);color:var(--fg-muted);width:40px;text-align:right;flex:none}
</style></head><body>
<div class="row"><div class="tag">space-1</div><div class="box" style="width:4px"></div><div class="val">4px</div></div>
<div class="row"><div class="tag">space-2</div><div class="box" style="width:8px"></div><div class="val">8px</div></div>
<div class="row"><div class="tag">space-3</div><div class="box" style="width:12px"></div><div class="val">12px</div></div>
<div class="row"><div class="tag">space-4</div><div class="box" style="width:16px"></div><div class="val">16px</div></div>
<div class="row"><div class="tag">space-5</div><div class="box" style="width:20px"></div><div class="val">20px</div></div>
<div class="row"><div class="tag">space-6</div><div class="box" style="width:24px"></div><div class="val">24px</div></div>
<div class="row"><div class="tag">space-8</div><div class="box" style="width:32px"></div><div class="val">32px</div></div>
<div class="row"><div class="tag">space-10</div><div class="box" style="width:48px"></div><div class="val">48px</div></div>
<div class="row"><div class="tag">space-12</div><div class="box" style="width:64px"></div><div class="val">64px</div></div>
</body></html>
