<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:18px;background:var(--bg)}
.wrap{width:240px;max-height:280px;overflow:auto;background:var(--paper-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px}
.row{display:grid;grid-template-columns:28px 18px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-radius:var(--radius-xs);font-family:var(--font-mono);font-size:13px}
.row:hover{background:var(--paper-2)}
.row .n{color:var(--fg-subtle);font-size:11px;text-align:right}
.row .s{width:12px;height:12px;border-radius:50%;box-shadow:var(--shadow-stone)}
.sb{background:radial-gradient(circle at 36% 30%,#3a3230,#0b0907)}
.sw{background:radial-gradient(circle at 36% 30%,#FDFAF2,#D9CFB8)}
.row .c{color:var(--fg);letter-spacing:0.02em}
.row .t{font-size:11px;color:var(--fg-subtle)}
.eyebrow{font:600 11px var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:8px;padding:0 4px}
</style></head><body>
<div class="wrap">
  <div class="eyebrow">Move history</div>
  <div class="row"><div class="n">1</div><div class="s sb"></div><div class="c">H8</div><div class="t">0:04</div></div>
  <div class="row"><div class="n">2</div><div class="s sw"></div><div class="c">I8</div><div class="t">0:18</div></div>
  <div class="row"><div class="n">3</div><div class="s sb"></div><div class="c">I9</div><div class="t">0:22</div></div>
  <div class="row"><div class="n">4</div><div class="s sw"></div><div class="c">J10</div><div class="t">0:31</div></div>
  <div class="row"><div class="n">5</div><div class="s sb"></div><div class="c">G7</div><div class="t">0:39</div></div>
  <div class="row"><div class="n">6</div><div class="s sw"></div><div class="c">J8</div><div class="t">0:48</div></div>
</div>
</body></html>
