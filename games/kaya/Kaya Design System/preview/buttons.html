<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:var(--bg);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{
  font:600 14px var(--font-sans);
  padding:10px 18px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition: background var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast);
}
.primary{background:var(--sumi);color:#fff;box-shadow:var(--shadow-1)}
.primary:hover{background:var(--sumi-hover)}
.primary:active{background:var(--sumi-press)}
.secondary{background:var(--paper-1);color:var(--fg);border-color:var(--border-strong)}
.secondary:hover{background:var(--paper-2)}
.ghost{background:transparent;color:var(--fg);border-color:transparent}
.ghost:hover{background:var(--paper-2)}
.disabled{background:var(--paper-1);color:var(--fg-disabled);border-color:var(--border);cursor:not-allowed}
.icon{width:36px;height:36px;padding:0;justify-content:center;background:var(--paper-1);color:var(--fg);border-color:var(--border)}
.icon:hover{background:var(--paper-2)}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<button class="btn primary">New game</button>
<button class="btn secondary"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>Undo</button>
<button class="btn ghost">Settings</button>
<button class="btn disabled">Hint</button>
<button class="btn icon" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<button class="btn icon" title="Sound"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
</body></html>
