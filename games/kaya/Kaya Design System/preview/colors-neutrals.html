<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:stretch}
.sw{flex:1;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.sw .name{font:500 11px var(--font-mono);color:inherit;opacity:0.85;letter-spacing:0.02em}
.sw .hex{font:400 10px var(--font-mono);opacity:0.6;margin-top:2px}
h3{margin:0 0 4px;font:600 12px var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-subtle)}
</style></head><body>
<div>
<h3>Paper — warm neutral base</h3>
<div class="row">
  <div class="sw" style="background:var(--paper-0);color:var(--ink-0)"><div class="name">paper-0</div><div class="hex">#FBF9F5</div></div>
  <div class="sw" style="background:var(--paper-1);color:var(--ink-0)"><div class="name">paper-1</div><div class="hex">#F5F1E8</div></div>
  <div class="sw" style="background:var(--paper-2);color:var(--ink-0)"><div class="name">paper-2</div><div class="hex">#ECE5D4</div></div>
  <div class="sw" style="background:var(--paper-3);color:var(--ink-0)"><div class="name">paper-3</div><div class="hex">#DDD2B8</div></div>
</div>
</div>
<div>
<h3>Ink — foreground warm charcoal</h3>
<div class="row">
  <div class="sw" style="background:var(--ink-0);color:#fff"><div class="name">ink-0</div><div class="hex">#2A231C</div></div>
  <div class="sw" style="background:var(--ink-1);color:#fff"><div class="name">ink-1</div><div class="hex">#4E4539</div></div>
  <div class="sw" style="background:var(--ink-2);color:#fff"><div class="name">ink-2</div><div class="hex">#7B7267</div></div>
  <div class="sw" style="background:var(--ink-3);color:var(--ink-0)"><div class="name">ink-3</div><div class="hex">#ADA699</div></div>
</div>
</div>
</body></html>
