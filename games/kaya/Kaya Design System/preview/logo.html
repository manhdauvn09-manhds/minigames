<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.mark{display:flex;align-items:center;gap:14px}
.stone{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#3a3230 0%,#1f1a17 55%,#0b0907 100%);box-shadow:var(--shadow-stone);position:relative}
.stone::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0) 22%)}
.word{font-family:"Fraunces",serif;font-size:48px;font-weight:500;letter-spacing:-0.02em;color:var(--ink-0);line-height:1;font-variation-settings:"opsz" 144,"SOFT" 30}
.sub{font-family:"Inter",sans-serif;font-size:11px;color:var(--fg-subtle);letter-spacing:0.2em;text-transform:uppercase;margin-top:4px}
</style></head><body>
<div class="mark">
  <div class="stone"></div>
  <div><div class="word">Kaya</div><div class="sub">Five in a row</div></div>
</div>
</body></html>
