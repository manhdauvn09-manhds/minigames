<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px}
.sw{flex:1;height:72px;border-radius:var(--radius-sm);border:1px solid var(--border);padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.sw .name{font:500 11px var(--font-mono);opacity:0.9}
.sw .hex{font:400 10px var(--font-mono);opacity:0.65}
.sw .lbl{font:600 12px var(--font-sans)}
h3{margin:0 0 4px;font:600 12px var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-subtle)}
</style></head><body>
<div>
<h3>Kaya wood — board surface only</h3>
<div class="row">
  <div class="sw" style="background:var(--kaya-0);color:var(--ink-0)"><div class="lbl">Highlight</div><div><div class="name">--kaya-0</div><div class="hex">#E8D6B0</div></div></div>
  <div class="sw" style="background:var(--kaya-1);color:var(--ink-0)"><div class="lbl">Base</div><div><div class="name">--kaya-1</div><div class="hex">#D8BE8C</div></div></div>
  <div class="sw" style="background:var(--kaya-2);color:#fff"><div class="lbl">Shadow</div><div><div class="name">--kaya-2</div><div class="hex">#B89968</div></div></div>
  <div class="sw" style="background:var(--kaya-grid);color:#fff"><div class="lbl">Grid lines</div><div><div class="name">--kaya-grid</div><div class="hex">#7F6441</div></div></div>
</div>
</div>
<div>
<h3>Semantic status</h3>
<div class="row">
  <div class="sw" style="background:var(--win);color:#fff"><div class="lbl">Win</div><div><div class="name">--win</div><div class="hex">muted moss</div></div></div>
  <div class="sw" style="background:var(--loss);color:#fff"><div class="lbl">Loss</div><div><div class="name">--loss</div><div class="hex">= sumi</div></div></div>
  <div class="sw" style="background:var(--draw);color:#fff"><div class="lbl">Draw</div><div><div class="name">--draw</div><div class="hex">= ink-2</div></div></div>
</div>
</div>
</body></html>
