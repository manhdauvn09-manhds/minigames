<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:14px;max-width:360px}
.field label{display:block;font:600 12px var(--font-sans);color:var(--fg-subtle);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px}
input[type=text]{
  width:100%;box-sizing:border-box;padding:10px 12px;
  font:400 15px var(--font-sans);color:var(--fg);
  background:var(--paper-0);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast);
}
input[type=text]:focus{outline:none;border-color:var(--sumi);box-shadow:0 0 0 3px var(--sumi-ring)}
.toggle{display:flex;align-items:center;gap:10px;font:500 14px var(--font-sans);color:var(--fg)}
.switch{width:40px;height:22px;background:var(--paper-3);border-radius:999px;position:relative;transition:background var(--dur-fast)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:var(--shadow-1);transition:transform var(--dur-fast)}
.switch.on{background:var(--sumi)}
.switch.on::after{transform:translateX(18px)}
.seg{display:inline-flex;background:var(--paper-2);padding:3px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:6px 14px;font:500 13px var(--font-sans);color:var(--fg-muted);border-radius:4px;cursor:pointer}
.seg button.active{background:var(--paper-0);color:var(--fg);box-shadow:var(--shadow-1)}
</style></head><body>
<div class="field"><label>Player name</label><input type="text" value="Anonymous"/></div>
<div class="toggle">Sound <div class="switch on"></div></div>
<div class="seg"><button>Light</button><button class="active">Dark</button><button>Auto</button></div>
</body></html>
