<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:22px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:baseline;gap:20px;padding:6px 0;border-bottom:1px dashed var(--border)}
.row:last-child{border:0}
.name{font:500 11px var(--font-mono);color:var(--fg-subtle);width:64px;flex:none}
.size{font:500 11px var(--font-mono);color:var(--fg-muted);width:54px;flex:none;text-align:right}
.samp{flex:1;color:var(--fg);font-family:var(--font-sans)}
</style></head><body>
<div class="row"><div class="name">5xl</div><div class="size">96 / 1.12</div><div class="samp" style="font-family:var(--font-serif);font-weight:500;font-size:64px;line-height:1">Kaya</div></div>
<div class="row"><div class="name">3xl</div><div class="size">44 / 1.12</div><div class="samp" style="font-size:36px;font-weight:600;letter-spacing:-0.02em">You won</div></div>
<div class="row"><div class="name">2xl</div><div class="size">32 / 1.25</div><div class="samp" style="font-size:28px;font-weight:600">Settings</div></div>
<div class="row"><div class="name">xl</div><div class="size">24 / 1.25</div><div class="samp" style="font-size:22px;font-weight:600">Move history</div></div>
<div class="row"><div class="name">md</div><div class="size">17 / 1.5</div><div class="samp">Bot is thinking.</div></div>
<div class="row"><div class="name">base</div><div class="size">15 / 1.5</div><div class="samp">Place your stone to align five.</div></div>
<div class="row"><div class="name">sm</div><div class="size">13 / 1.5</div><div class="samp" style="color:var(--fg-muted)">Hints available on level 1–2.</div></div>
<div class="row"><div class="name">xs</div><div class="size">12 / 1</div><div class="samp" style="font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-subtle)">Current turn</div></div>
</body></html>
