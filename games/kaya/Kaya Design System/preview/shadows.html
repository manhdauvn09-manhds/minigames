<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:var(--bg);display:flex;gap:28px;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.box{background:var(--paper-0);border:1px solid var(--border);width:96px;height:72px;border-radius:var(--radius-md)}
.name{font:500 11px var(--font-mono);color:var(--fg)}
.hex{font:400 10px var(--font-mono);color:var(--fg-subtle)}
</style></head><body>
<div class="col"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="name">shadow-1</div><div class="hex">buttons, chips</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="name">shadow-2</div><div class="hex">cards, board</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="name">shadow-3</div><div class="hex">modals</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-stone);border-radius:var(--radius-full);background:var(--stone-black);width:60px;height:60px"></div><div class="name">shadow-stone</div><div class="hex">the stones</div></div>
</body></html>
