<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.18  0 0 0 0.10 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.4" numOctaves="2" seed="3"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0 0.10  0 0 0 0.06 0"></feColorMatrix>
    </filter>
    <linearGradient id="woodBase" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#E3C89A"></stop>
      <stop offset="50%" stop-color="#D8BE8C"></stop>
      <stop offset="100%" stop-color="#CBAF7A"></stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#woodBase)"></rect>
  <rect width="100%" height="100%" filter="url(#grain2)" opacity="0.9"></rect>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.5"></rect>
</svg>