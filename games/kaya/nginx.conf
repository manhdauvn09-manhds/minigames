# Carogame nginx vhost -- serves the static SPA + health probe.
#
# The game has no backend (all AI is client-side in JS + a Web Worker),
# so we only need: static file serving, a /health route for docker
# healthcheck + deploy probe, and sensible caching headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression -- shaves a few KB off the Kaya CSS + JS modules.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Health probe -- used by docker HEALTHCHECK and ssh_deploy_subapps.py.
    # Static, fixed body so the container's "healthy" state doesn't
    # depend on the index.html shipping correctly.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Long-lived cache on everything under /assets, /src, and the Kaya
    # Design System folder. Everything there is fingerprint-free so the
    # browser's own "disk cache" revalidation kicks in on rebuilds.
    # Regex is QUOTED because the folder name contains a literal space --
    # nginx tokenizes location args on whitespace, so an unquoted regex
    # with `Kaya Design System` produces "invalid number of arguments".
    # $uri is percent-decoded so the literal space is what we match.
    location ~* "^/(assets|src|Kaya Design System)/" {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Generic static-asset caching for anything else that looks like
    # a versioned resource.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA-ish fallback -- index.html for "/" and for any future routes
    # we might add (e.g. /selftest). Keeps deep-linking cheap.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers applied at the subapp level as well as the
    # outer host's security-headers-subapps.conf snippet.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
