<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kaya Online — Caro PvP</title>
<style>
:root{--bg:#0a0a12;--panel:#13131f;--line:#2a2a44;--accent:#a78bfa;--amber:#fbbf24;--green:#34d399;--red:#f87171;--txt:#e8e8f5;--mut:#8b8ba8;--wood:#1c1830}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
.top{width:100%;max-width:560px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.15rem;color:var(--accent)}
.top .sub{font-size:.74rem;color:var(--mut)}
.top a{margin-left:auto;color:var(--mut);text-decoration:none;font-size:.85rem;border:1px solid var(--line);padding:6px 11px;border-radius:8px}
.top a:hover{color:var(--txt);border-color:var(--accent)}
.online{font-size:.74rem;color:var(--green)}
.status{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:54px}
.status .who{flex:1;font-size:.92rem;font-weight:600}
.status .turn{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.turn.B{background:#15151c;border:2px solid #555}.turn.W{background:#f4f4fa;border:2px solid #bbb}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(167,139,250,.15);color:var(--accent)}
.badge.win{background:rgba(52,211,153,.15);color:var(--green)}.badge.lose{background:rgba(248,113,113,.15);color:var(--red)}
.boardwrap{width:100%;max-width:560px;aspect-ratio:1;background:var(--wood);border:1px solid var(--line);border-radius:12px;padding:8px}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:0}
.cell{position:relative;border:.5px solid rgba(167,139,250,.12);background:transparent;cursor:pointer;padding:0}
.cell:disabled{cursor:default}
.cell::after{content:'';position:absolute;inset:14%;border-radius:50%;transform:scale(0);transition:transform .12s}
.cell.B::after{background:radial-gradient(circle at 35% 30%,#3a3a4a,#101018);transform:scale(1);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.cell.W::after{background:radial-gradient(circle at 35% 30%,#fff,#cfcfe0);transform:scale(1);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.cell.win::after{box-shadow:0 0 0 2px var(--amber),0 0 10px var(--amber)}
.cell.last{outline:2px solid var(--accent);outline-offset:-2px}
.cell:not(:disabled):not(.B):not(.W):hover::after{transform:scale(.55);background:rgba(167,139,250,.3)}
.controls{width:100%;max-width:560px;display:flex;gap:9px;flex-wrap:wrap}
button.btn{flex:1;min-width:120px;border:none;border-radius:10px;padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;background:var(--accent);color:#0a0a12}
button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
button.btn:disabled{opacity:.4;cursor:default}
.hint{width:100%;max-width:560px;font-size:.78rem;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div class="top">
  <div><h1>⚫ Kaya Online</h1><div class="sub">Caro / Gomoku · 5 in a row · PvP</div></div>
  <span class="online" id="online">● —</span>
  <a href="index.html">← Bot</a>
</div>

<div class="status">
  <span class="turn B" id="turnDot"></span>
  <span class="who" id="statusText">Sẵn sàng — bấm “Tìm trận”.</span>
  <span class="badge" id="badge" hidden></span>
</div>

<div class="boardwrap"><div class="board" id="board"></div></div>

<div class="controls">
  <button class="btn" id="queueBtn">🔍 Tìm trận</button>
  <button class="btn ghost" id="rematchBtn" hidden>🔄 Tái đấu</button>
  <button class="btn ghost" id="leaveBtn" hidden>🚪 Rời trận</button>
</div>
<div class="hint" id="hint">Người vào trước cầm quân đen (⚫) đi trước.</div>

<script>
const SIZE = 15;
const $ = s => document.querySelector(s);
const boardEl = $('#board');
let ws=null, myColor=null, myTurn=false, inGame=false, over=false, cells=[];

function buildBoard(){
  boardEl.innerHTML=''; cells=[];
  for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++){
    const b=document.createElement('button');
    b.className='cell'; b.dataset.x=x; b.dataset.y=y; b.disabled=true;
    b.addEventListener('click',()=>onCell(x,y));
    boardEl.appendChild(b); cells.push(b);
  }
}
const cellAt=(x,y)=>cells[y*SIZE+x];
function setBoardEnabled(on){ cells.forEach(c=>{ if(!c.classList.contains('B')&&!c.classList.contains('W')) c.disabled=!on; }); }

function profileName(){
  try{ const p=JSON.parse(localStorage.getItem('gp_global_profile')||'null'); if(p&&p.name) return p.name; }catch{}
  return 'Player' + Math.floor(Math.random()*900+100);
}
function profileId(){ try{ return (JSON.parse(localStorage.getItem('gp_global_profile')||'null')||{}).id||null; }catch{ return null; } }

function setStatus(text, dotColor){
  $('#statusText').textContent=text;
  const dot=$('#turnDot'); dot.className='turn '+(dotColor||'B');
  dot.style.visibility = dotColor ? 'visible':'hidden';
}
function showBadge(txt, cls){ const b=$('#badge'); b.hidden=false; b.textContent=txt; b.className='badge'+(cls?' '+cls:''); }
function hideBadge(){ $('#badge').hidden=true; }

function connect(){
  const proto = location.protocol==='https:'?'wss':'ws';
  ws = new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen=()=>{ ws.send(JSON.stringify({t:'hello',name:profileName(),userId:profileId()})); };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch{return;} handle(m); };
  ws.onclose=()=>{ setStatus('Mất kết nối — đang thử lại…', null); $('#online').textContent='● off'; setTimeout(connect,2000); resetGameUi(); };
  ws.onerror=()=>{ try{ws.close();}catch{} };
}
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }

function handle(m){
  switch(m.t){
    case 'welcome': case 'online': $('#online').textContent='● '+m.n+' online'; break;
    case 'queued': setStatus('Đang tìm đối thủ…', null); $('#queueBtn').textContent='⏳ Đang tìm…'; $('#queueBtn').disabled=false; $('#queueBtn').dataset.mode='cancel'; break;
    case 'cancelled': resetGameUi(); break;
    case 'start': startGame(m); break;
    case 'move': applyMove(m); break;
    case 'over': endGame(m); break;
    case 'opp_left': if(inGame&&!over){ over=true; setStatus('Đối thủ đã rời — bạn thắng!', null); showBadge('🏆 THẮNG (walkover)','win'); afterGame(); } break;
    case 'rematch_wait': setStatus('Đã sẵn sàng — chờ đối thủ đồng ý tái đấu…', null); $('#rematchBtn').disabled=true; break;
    case 'error': if(m.msg==='opp_wants_rematch'){ $('#rematchBtn').textContent='🔄 Đối thủ muốn tái đấu!'; } break;
  }
}

function startGame(m){
  buildBoard(); hideBadge(); over=false; inGame=true;
  myColor=m.color; myTurn=m.yourTurn;
  $('#queueBtn').hidden=true; $('#rematchBtn').hidden=true; $('#leaveBtn').hidden=false;
  const youAre = myColor==='B'?'⚫ Đen':'⚪ Trắng';
  $('#hint').textContent = 'Bạn: '+youAre+' · Đối thủ: '+(m.opponent||'?');
  updateTurnUi();
}
function updateTurnUi(){
  if(over) return;
  if(myTurn){ setStatus('Lượt của BẠN', myColor); setBoardEnabled(true); }
  else { setStatus('Đối thủ đang suy nghĩ…', myColor==='B'?'W':'B'); setBoardEnabled(false); }
}
function onCell(x,y){
  if(!inGame||over||!myTurn) return;
  const c=cellAt(x,y); if(c.classList.contains('B')||c.classList.contains('W')) return;
  send({t:'move',x,y});          // optimistic disable; server echoes the authoritative move
  setBoardEnabled(false);
}
function applyMove(m){
  cells.forEach(c=>c.classList.remove('last'));
  const c=cellAt(m.x,m.y); c.classList.add(m.color,'last'); c.disabled=true;
  myTurn = (m.nextTurn===myColor);
  updateTurnUi();
}
function endGame(m){
  over=true; setBoardEnabled(false);
  if(m.line) m.line.forEach(([x,y])=>cellAt(x,y).classList.add('win'));
  if(m.result==='win'){ setStatus('Bạn THẮNG! 🎉', null); showBadge('🏆 THẮNG','win'); }
  else if(m.result==='lose'){ setStatus('Bạn thua 😞', null); showBadge('THUA','lose'); }
  else { setStatus('Hòa! Bàn cờ đã đầy.', null); showBadge('HÒA'); }
  afterGame();
}
function afterGame(){ $('#leaveBtn').hidden=false; $('#rematchBtn').hidden=false; $('#rematchBtn').disabled=false; $('#rematchBtn').textContent='🔄 Tái đấu'; }
function resetGameUi(){
  inGame=false; over=false; myColor=null; myTurn=false;
  $('#queueBtn').hidden=false; $('#queueBtn').disabled=false; $('#queueBtn').textContent='🔍 Tìm trận'; $('#queueBtn').dataset.mode='queue';
  $('#rematchBtn').hidden=true; $('#leaveBtn').hidden=true; hideBadge();
  setStatus('Sẵn sàng — bấm “Tìm trận”.', null);
}

$('#queueBtn').addEventListener('click',()=>{
  if($('#queueBtn').dataset.mode==='cancel'){ send({t:'cancel'}); resetGameUi(); }
  else { send({t:'queue'}); }
});
$('#rematchBtn').addEventListener('click',()=>{ send({t:'rematch'}); $('#rematchBtn').textContent='⏳ Chờ đối thủ…'; });
$('#leaveBtn').addEventListener('click',()=>{ send({t:'leave'}); resetGameUi(); buildBoard(); });

buildBoard(); resetGameUi(); connect();
</script>
</body>
</html>
