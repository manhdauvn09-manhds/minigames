  <style>

    .hud-btn {

    .hud-btn:hover { background: rgba(255,255,255,.2); }

    /* Timer bar */
    .timer-wrap { width: 100%; max-width: 380px; margin-bottom: 6px; }
    .timer-bar { height: 8px; background: rgba(255,255,255,0.14); border-radius: 4px; overflow: hidden; }
    .timer-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #00ff88, #4ecdc4); transition: width 1s linear, background 0.4s; }
    .timer-fill.danger { background: linear-gradient(90deg, #ff6b6b, #ff9f43); }
    .timer-info { display: flex; justify-content: space-between; font-size: 0.7em; opacity: 0.75; margin-top: 3px; }
    .target-check { color: #00ff88 !important; font-weight: 700; opacity: 1 !important; }
    @keyframes timerPulse { 0%,100%{ opacity:.75; } 50%{ opacity:1; color:#ff6b6b; } }
    .timer-warn { animation: timerPulse .8s ease infinite; }

    .next-row { font-size: 0.82em; opacity: 0.85; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .next-preview {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75em; font-weight: 700; color: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.3);
    }
    .level-tag { font-size: .72em; color: #a78bfa; font-weight: 700; }

    .game-wrap {
      position: relative; background: rgba(0,0,0,0.22);
      border: 2px solid rgba(255,255,255,0.18); border-radius: 14px;
      overflow: hidden; cursor: crosshair; touch-action: none;
    }
    #gc { display: block; }

    /* ── Combo / Chain popups ─────────────────────────────────────────── */
    #comboMsg {
      position: fixed; top: 28%; left: 50%; transform: translate(-50%,-50%);
      font-size: 1.8em; font-weight: 900; pointer-events: none;
      text-shadow: 0 2px 12px currentColor; opacity: 0; z-index: 200;
      white-space: nowrap;
    }
    .combo-pop { animation: comboPop .9s ease-out forwards; }
    @keyframes comboPop {
      0%  { opacity:1; transform:translate(-50%,-50%) scale(.7); }
      30% { opacity:1; transform:translate(-50%,-55%) scale(1.2); }
      100%{ opacity:0; transform:translate(-50%,-130%) scale(1.4); }
    }
    #chainMsg {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%);
      font-size: 1.3em; font-weight: 800; pointer-events: none;
      text-shadow: 0 2px 10px currentColor; opacity: 0; z-index: 200;
    }
    .chain-pop { animation: chainPop 1s ease-out forwards; }
    @keyframes chainPop {
      0%  { opacity:1; transform:translate(-50%,-50%) scale(.8); }
      100%{ opacity:0; transform:translate(-50%,-100%) scale(1.3); }
    }

    /* ── Celebration overlay ──────────────────────────────────────────── */
    .cel-overlay {
      position: fixed; inset: 0; z-index: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0); pointer-events: none; transition: background .6s;
    }
    .cel-overlay.active { background: rgba(0,0,0,.75); pointer-events: all; }
    .cel-box {
      text-align: center;
      transform: scale(.5); opacity: 0;
      transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s;
    }
    .cel-overlay.active .cel-box { transform: scale(1); opacity: 1; }
    .cel-title { font-size: 2.2em; font-weight: 900; margin-bottom: 8px; text-shadow: 0 0 30px currentColor; }
    .cel-stars { font-size: 2.8em; margin: 12px 0; min-height: 50px; }
    .cel-star { display: inline-block; opacity: 0; filter: drop-shadow(0 0 8px rgba(255,211,42,.6)); }
    .cel-star.anim { animation: starIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes starIn {
      0%  { opacity:0; transform:scale(0) rotate(-180deg); }
      60% { opacity:1; transform:scale(1.3) rotate(15deg); }
      100%{ opacity:1; transform:scale(1) rotate(0); }
    }
    .cel-score {
      font-size: 2.4em; font-weight: 900; margin: 8px 0;
      background: linear-gradient(90deg,#f59e0b,#ef4444);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .cel-msg { font-size: 1.05em; opacity: .85; margin: 6px 0; max-width: 300px; line-height: 1.4; }
    .cel-sub { font-size: .82em; opacity: .5; margin-top: 8px; }

    /* ── Confetti ─────────────────────────────────────────────────────── */
    .confetti { position: fixed; pointer-events: none; z-index: 501; animation: confFall linear forwards; }
    @keyframes confFall {
      0%  { transform: translateY(-20px) rotate(0deg); opacity:1; }
      80% { opacity:1; }
      100%{ transform: translateY(110vh) rotate(720deg); opacity:0; }
    }

<body>
  <h1>🎱 BallMerge</h1>
  <p class="subtitle">Drop balls — match numbers — chain merges!</p>

  <div class="hud" id="hudRow" style="display:none">

  <div class="cel-overlay" id="celOverlay">
    <div class="cel-box">
      <div class="cel-title" id="celTitle"></div>
      <div class="cel-stars" id="celStars"></div>
      <div class="cel-score" id="celScore"></div>

      <div class="cel-sub" id="celSub"></div>
    </div>
  </div>

  <script src="../../game-platform.js?v=11"></script>
  <script>
    /* ── 30 progressive levels ──────────────────────────────────────────── */
    const LEVELS = (() => {
      const arr = [];
      for (let i = 0; i < 30; i++) {
        const maxDrop     = Math.min(2 + Math.floor(i / 3), 6);
        const maxVal      = Math.min(4 + Math.floor(i / 3), 9);
        const cols        = i < 5 ? 6 : i < 12 ? 5 : i < 20 ? 5 : 4;
        const rows        = i < 5 ? 9 : i < 12 ? 8 : i < 20 ? 7 : 6;
        const scoreTarget = Math.round(20000 * Math.pow(1.28, i));
        const bonus       = +(1.0 + i * 0.04).toFixed(2);
        const minVal      = Math.min(1 + Math.floor(i / 5), 4);
        const totalCells  = cols * rows;
        const prefill     = Math.min(2 + Math.floor(i / 3), Math.floor(totalCells * 0.35));
        const timeLimit   = Math.min(120 + Math.floor(i * 6.2), 300); // 2min → 5min
        arr.push({ maxDrop, maxVal, cols, rows, scoreTarget, bonus, minVal, prefill, timeLimit });
      }
      return arr;
    })();

    const COLORS = [null,'#FF6B6B','#FF9F43','#FFD32A','#2ECC71','#4ECDC4','#764BA2','#FFB347','#D4AF37','#FFD700'];
    const LABELS = ['','1','2','3','4','5','6','7','8','9'];
    let CELL = 52;

    /* ── State ──────────────────────────────────────────────────────────── */
    let board, score, nextBall, animating, dead, hoverCol = -1, flashing = [];
    let currentCols, currentRows, currentMaxDrop, currentMaxVal, currentTarget, currentBonus, currentMinVal;
    let gameRunning = false, paused = false, currentMode = 'normal', currentLevel = 0;
    let timerInterval = null, timeLeft = 0, levelTimeLimit = 0;
    let chainCount = 0, targetNotified = false;

    const canvas = document.getElementById('gc');
    const ctx    = canvas.getContext('2d');

    /* ── i18n helpers ───────────────────────────────────────────────────── */
    function _lang() {
      try {
        const s = localStorage.getItem('gp_lang');
        if (s) return s;
        const n = (navigator.language || '').toLowerCase();
        return n.startsWith('ja') ? 'ja' : n.startsWith('vi') ? 'vi' : 'en';
      } catch (e) { return 'en'; }
    }
    const T = {
      en: {
        clear: '🎉 LEVEL CLEAR! 🎉',
        timeUp: "⏰ TIME'S UP!",
        boardFull: '💥 BOARD FULL!',
        gameOver: '🎮 GAME OVER',
        targetHit: '✅ Target reached!',
        remaining: 'remaining',
        win: ["Incredible merge skills! 🔥","Merge master unleashed! 🏆","Unstoppable chain reactions! ⚡","You crushed it! 🚀","Brilliant strategy! 💎"],
        lose: ["So close! One more try! 💪","Don't give up! You're improving! 🎯","Almost there! Keep merging! 🔥","Great effort! Try a new strategy! 🌟","You'll get it next time! ⚡"],
        over: ["Great game! 🎮","Nice score! Try again? 🏅","Well played! 👏","Good effort! 💪"],
        chain: ['','','Double! 🔥','Triple! 💥','QUAD! ⚡','MEGA! 🌟','INSANE! 💎','GODLIKE! 👑'],
      },
      vi: {
        clear: '🎉 QUA MÀN! 🎉',
        timeUp: '⏰ HẾT GIỜ!',
        boardFull: '💥 BẢNG ĐẦY!',
        gameOver: '🎮 KẾT THÚC',
        targetHit: '✅ Đạt mục tiêu!',
        remaining: 'còn lại',
        win: ["Kỹ năng merge tuyệt vời! 🔥","Bậc thầy merge! 🏆","Chuỗi combo không thể chặn! ⚡","Quá đỉnh! 🚀","Chiến thuật xuất sắc! 💎"],
        lose: ["Gần lắm rồi! Thử lại nào! 💪","Đừng bỏ cuộc! Bạn đang tiến bộ! 🎯","Sắp được rồi! Merge tiếp! 🔥","Cố gắng tốt! Thử chiến thuật mới! 🌟","Lần sau sẽ được! ⚡"],
        over: ["Trận hay! 🎮","Điểm đẹp! Chơi lại? 🏅","Chơi tốt lắm! 👏","Cố gắng tốt! 💪"],
        chain: ['','','Đôi! 🔥','Ba! 💥','BỐN! ⚡','MEGA! 🌟','SIÊU! 💎','THẦN! 👑'],
      },
      ja: {
        clear: '🎉 レベルクリア！🎉',
        timeUp: '⏰ タイムアップ！',
        boardFull: '💥 ボード満杯！',
        gameOver: '🎮 ゲームオーバー',
        targetHit: '✅ 目標達成！',
        remaining: '残り',
        win: ["マージスキル最高！🔥","マージマスター！🏆","止められない連鎖！⚡","素晴らしい！🚀","見事な戦略！💎"],
        lose: ["惜しい！もう一回！💪","諦めないで！上達中！🎯","もう少し！続けて！🔥","よく頑張った！新戦略で！🌟","次こそ！⚡"],
        over: ["いいゲーム！🎮","ナイススコア！🏅","グッドプレイ！👏","頑張った！💪"],
        chain: ['','','ダブル！🔥','トリプル！💥','クアッド！⚡','メガ！🌟','超！💎','神！👑'],
      },
    };
    function t(k)    { const l = _lang(); return (T[l] && T[l][k]) || T.en[k] || ''; }
    function tRand(k){ const l = _lang(); const a = (T[l] && T[l][k]) || T.en[k] || []; return a[Math.floor(Math.random() * a.length)] || ''; }

    /* ── Star rating ────────────────────────────────────────────────────── */
    function calcStars(sc, tgt) {
      if (!tgt || sc < tgt) return 0;
      const r = sc / tgt;
      if (r >= 5) return 5;
      if (r >= 3) return 4;
      if (r >= 2) return 3;
      if (r >= 1.5) return 2;
      return 1;
    }

    /* ── Platform integration ───────────────────────────────────────────── */
    GamePlatform.init({
      id: 'ballmerge',
      name: '🎱 BallMerge',
      icon: '🎱',
      description: {
        en: 'Drop balls — same numbers merge into bigger ones! Chain combos for huge scores.',
        vi: 'Thả bóng — số giống nhau hợp nhất thành số lớn hơn! Combo liên hoàn để ghi điểm khủng.',
        ja: 'ボールを落とそう — 同じ数字が合体して大きくなる！コンボを繋げてハイスコア！'
      },
      levels: LEVELS,
      howto: {
        en: `<h3>🎱 BallMerge</h3>
<ul>
  <li><b>Click / tap</b> a column to drop your ball</li>
  <li>Two <b>touching balls with the same number</b> merge → (n+1)</li>
  <li>Merges <b>cascade</b> — chain reactions = huge scores!</li>
  <li>Reach <b>★ (9+1)</b> for the ultimate star ball</li>
  <li>Game over when any column fills to the <b>top</b></li>
  <li><b>Adventure</b>: reach the target score before time runs out!</li>
  <li>Earn <b>1-5 ⭐</b> based on how far you exceed the target</li>
</ul>`,
        vi: `<h3>🎱 BallMerge</h3>
<ul>
  <li><b>Click / chạm</b> vào cột để thả bóng</li>
  <li>Hai bóng <b>cùng số chạm nhau</b> → gộp thành số lớn hơn</li>
  <li>Gộp <b>liên hoàn</b> = combo điểm khổng lồ!</li>
  <li>Đạt <b>★</b> là đỉnh cao nhất</li>
  <li>Game over khi cột đầy tới <b>đỉnh</b></li>
  <li><b>Adventure</b>: đạt mục tiêu trước khi hết giờ!</li>
  <li>Đạt <b>1-5 ⭐</b> tùy theo điểm vượt mục tiêu</li>
</ul>`,
        ja: `<h3>🎱 BallMerge</h3>
<ul>
  <li>列を<b>クリック/タップ</b>してボールを落とす</li>
  <li><b>同じ数字のボール</b>が隣接 → 合体</li>
  <li><b>連鎖</b>合体 = 大量得点！</li>
  <li><b>★</b>が最高レベル</li>
  <li>列が<b>上まで</b>埋まるとゲームオーバー</li>
  <li><b>アドベンチャー</b>: 制限時間内に目標達成！</li>
  <li>目標超過で<b>1-5 ⭐</b>獲得</li>
</ul>`
      },
      onStart({ mode, level, levelConfig }) {
        currentMode  = mode;
        currentLevel = level;
        startGame(levelConfig);
      },
      onGetState() {
        return { board, score, nextBall, cols: currentCols, rows: currentRows, timeLeft };
      },
      onRestoreState(snap, ctx2) {
        startGame(ctx2.levelConfig);
      }
    });

    /* ── Game logic ─────────────────────────────────────────────────────── */
    function startGame(lc) {
      lc = lc || {};
      currentCols    = lc.cols      || 6;
      currentRows    = lc.rows      || 9;
      currentMaxDrop = lc.maxDrop   || 3;
      currentMaxVal  = lc.maxVal    || 7;
      currentTarget  = lc.scoreTarget || 0;
      currentBonus   = lc.bonus     || 1;
      currentMinVal  = lc.minVal    || 1;
      const prefill  = lc.prefill   || 0;
      const tl       = lc.timeLimit || 0;

      // Responsive CELL size
      const maxH = window.innerHeight - 310;
      const maxW = Math.min(window.innerWidth - 20, 600);
      CELL = Math.floor(Math.min(maxW / currentCols, maxH / currentRows, 52));

      canvas.width  = currentCols * CELL;
      canvas.height = currentRows * CELL;
      document.getElementById('wrap').style.width = canvas.width + 'px';

      board = Array.from({ length: currentRows }, () => new Array(currentCols).fill(0));
      for (let p = 0; p < prefill; p++) {
        const pr = currentRows - 1 - Math.floor(Math.random() * Math.min(3, currentRows));
        const pc = Math.floor(Math.random() * currentCols);
        if (!board[pr][pc]) board[pr][pc] = currentMinVal + Math.floor(Math.random() * Math.min(3, currentMaxVal - currentMinVal + 1));
      }

      score = 0; animating = false; dead = false; paused = false;
      gameRunning = true; flashing = []; chainCount = 0; targetNotified = false;
      nextBall = rnd();

      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      // UI
      document.getElementById('hudRow').style.display   = 'flex';
      document.getElementById('nextRow').style.display  = 'flex';
      document.getElementById('wrap').style.display     = 'block';
      document.getElementById('target').textContent     = currentTarget ? currentTarget.toLocaleString() : '—';
      document.getElementById('target').style.color     = '#00ff88';
      document.getElementById('lvlTag').textContent     = currentMode === 'adventure' ? `Lv ${currentLevel + 1}` : '';
      document.getElementById('pauseBtn').textContent   = '⏸';

      // Timer (adventure only)
      const hasTimer = currentMode === 'adventure' && tl > 0;
      document.getElementById('timeItem').style.display   = hasTimer ? 'block' : 'none';
      document.getElementById('timerWrap').style.display   = hasTimer ? 'block' : 'none';
      document.getElementById('tCheck').textContent        = '';
      document.getElementById('tCheck').className          = '';
      if (hasTimer) startTimer(tl);

      syncUI();
      draw();
    }

    function rnd() {
      return currentMinVal + Math.floor(Math.random() * (currentMaxDrop - currentMinVal + 1));
    }

    function syncUI() {
      const hs = +localStorage.getItem('bm_hs') || 0;
      document.getElementById('score').textContent = score.toLocaleString();
      document.getElementById('best').textContent  = hs.toLocaleString();
      const p = document.getElementById('nextPrev');
      p.style.background = COLORS[nextBall] || '#888';
      p.textContent = LABELS[nextBall] || nextBall;
      document.getElementById('nextLabel').textContent = 'Lv ' + nextBall;

      // Target-reached notification (adventure)
      if (currentMode === 'adventure' && currentTarget && score >= currentTarget && !targetNotified) {
        targetNotified = true;
        document.getElementById('target').style.color = '#FFD32A';
        document.getElementById('tCheck').textContent = '✅';
        document.getElementById('tCheck').className   = 'target-check';
        showChain(t('targetHit'), '#00ff88');
      }
    }

    function drop(col) {
      if (animating || dead || paused || !gameRunning) return;
      let row = -1;
      for (let r = currentRows - 1; r >= 0; r--) {
        if (!board[r][col]) { row = r; break; }
      }
      if (row === -1) return;

      board[row][col] = nextBall;
      nextBall = rnd();
      chainCount = 0;
      syncUI();
      animating = true;

      processMerges(() => {
        animating = false;
        if (board[0].some(v => v !== 0)) { endGame('boardFull'); return; }
        // Adventure: do NOT auto-end on target — let timer run for more stars
        draw();
      });
    }

    function processMerges(done) {
      let merged = false;
      outer: for (let r = 0; r < currentRows; r++) {
        for (let c = 0; c < currentCols; c++) {
          const v = board[r][c];
          if (!v || v > 10) continue;
          for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < currentRows && nc >= 0 && nc < currentCols && board[nr][nc] === v) {
              board[nr][nc] = v + 1;
              board[r][c]   = 0;
              const pts = Math.round(v * v * 120 * currentBonus);
              score += pts;
              chainCount++;
              const hs = +localStorage.getItem('bm_hs') || 0;
              if (score > hs) localStorage.setItem('bm_hs', score);
              flashing = [{ r: nr, c: nc }];
              merged = true;

              // Combo popup
              showCombo('+' + pts.toLocaleString(), pts > 5000 ? '#FFD32A' : pts > 2000 ? '#4ECDC4' : '#00ff88');
              // Chain label
              if (chainCount >= 2) {
                const arr = t('chain');
                const ci = Math.min(chainCount, arr.length - 1);
                if (arr[ci]) showChain(arr[ci], chainCount >= 5 ? '#FFD32A' : chainCount >= 3 ? '#FF9F43' : '#4ECDC4');
              }
              break outer;
            }
          }
        }
      }
      syncUI();
      if (merged) { draw(); setTimeout(() => { flashing = []; processMerges(done); }, 160); }
      else done();
    }

    /* ── End game ───────────────────────────────────────────────────────── */
    function endGame(reason) {
      dead = true;
      gameRunning = false;
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

      if (currentMode === 'adventure') {
        const stars = calcStars(score, currentTarget);
        celebrateAdventure(stars > 0, stars, score, reason);
      } else {
        celebrateNormal(score);
      }
    }

    /* ── Timer ──────────────────────────────────────────────────────────── */
    function startTimer(secs) {
      timeLeft = secs;
      levelTimeLimit = secs;
      updateTimerUI();
      timerInterval = setInterval(() => {
        if (paused || !gameRunning) return;
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          endGame('timeUp');
        }
      }, 1000);
    }

    function updateTimerUI() {
      const pct = Math.max(0, (timeLeft / levelTimeLimit) * 100);
      const bar = document.getElementById('tBar');
      bar.style.width = pct + '%';
      bar.className = 'timer-fill' + (pct <= 20 ? ' danger' : '');
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const str = m + ':' + String(s).padStart(2, '0');
      document.getElementById('timeVal').textContent = str;
      document.getElementById('timeVal').className   = 'hud-value' + (timeLeft <= 30 ? ' timer-warn' : '');
      document.getElementById('tLabel').textContent  = str + ' ' + t('remaining');
    }

    /* ── Celebration: Adventure ─────────────────────────────────────────── */
    function celebrateAdventure(won, stars, sc, reason) {
      const ov    = document.getElementById('celOverlay');
      const title = document.getElementById('celTitle');
      const stEl  = document.getElementById('celStars');
      const scEl  = document.getElementById('celScore');
      const mgEl  = document.getElementById('celMsg');
      const sbEl  = document.getElementById('celSub');

      if (won) {
        title.textContent = t('clear');
        title.style.color = '#FFD32A';
        stEl.innerHTML = '';
        for (let i = 0; i < 5; i++) {
          const sp = document.createElement('span');
          sp.className = 'cel-star';
          sp.textContent = i < stars ? '⭐' : '☆';
          if (i >= stars) sp.style.opacity = '0.25';
          stEl.appendChild(sp);
          setTimeout(() => sp.classList.add('anim'), 400 + i * 280);
        }
        scEl.textContent = sc.toLocaleString();
        mgEl.textContent = tRand('win');
        sbEl.textContent = `Target: ${currentTarget.toLocaleString()} | ${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)}`;
        spawnConfetti(65);
      } else {
        title.textContent = reason === 'timeUp' ? t('timeUp') : t('boardFull');
        title.style.color = '#ff6b6b';
        stEl.innerHTML = '<span style="font-size:.9em">😤</span>';
        scEl.textContent = sc.toLocaleString();
        mgEl.textContent = tRand('lose');
        sbEl.textContent = `Target: ${currentTarget.toLocaleString()}`;
      }

      ov.classList.add('active');
      const delay = won ? 3800 : 2600;
      setTimeout(() => {
        ov.classList.remove('active');
        setTimeout(() => {
          const extra = won
            ? `${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)} (${stars}/5)`
            : `Target: ${currentTarget.toLocaleString()}`;
          GamePlatform.recordResult({ score: sc, cleared: won, extra });
        }, 450);
      }, delay);
    }

    /* ── Celebration: Normal mode ───────────────────────────────────────── */
    function celebrateNormal(sc) {
      const ov    = document.getElementById('celOverlay');
      const title = document.getElementById('celTitle');
      const stEl  = document.getElementById('celStars');
      const scEl  = document.getElementById('celScore');
      const mgEl  = document.getElementById('celMsg');
      const sbEl  = document.getElementById('celSub');

      title.textContent = t('gameOver');
      title.style.color = '#4ECDC4';
      stEl.innerHTML = '<span style="font-size:1em">🎱</span>';
      scEl.textContent = sc.toLocaleString();
      mgEl.textContent = tRand('over');
      sbEl.textContent = '';

      ov.classList.add('active');
      setTimeout(() => {
        ov.classList.remove('active');
        setTimeout(() => {
          GamePlatform.recordResult({ score: sc });
        }, 450);
      }, 2400);
    }

    /* ── Confetti ───────────────────────────────────────────────────────── */
    function spawnConfetti(n) {
      const cols = ['#FFD32A','#FF6B6B','#4ECDC4','#A78BFA','#FF9F43','#00FF88','#60A5FA','#F472B6'];
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = (Math.random() * 100) + 'vw';
        el.style.top  = '-20px';
        const sz = 6 + Math.random() * 10;
        el.style.width  = sz + 'px';
        el.style.height = sz + 'px';
        el.style.background    = cols[Math.floor(Math.random() * cols.length)];
        el.style.borderRadius  = Math.random() > .5 ? '50%' : '2px';
        el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        el.style.animationDelay    = (Math.random() * 1.8) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5500);
      }
    }

    /* ── Combo / Chain popups ──────────────────────────────────────────── */
    function showCombo(text, color) {
      const el = document.getElementById('comboMsg');
      el.textContent = text;
      el.style.color = color || '#00ff88';
      el.className = '';
      void el.offsetWidth;
      el.className = 'combo-pop';
    }
    function showChain(text, color) {
      const el = document.getElementById('chainMsg');
      el.textContent = text;
      el.style.color = color || '#4ECDC4';
      el.className = '';
      void el.offsetWidth;
      el.className = 'chain-pop';
    }

    /* ── Drawing ────────────────────────────────────────────────────────── */
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let r = 0; r <= currentRows; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(canvas.width, r * CELL); ctx.stroke(); }
      for (let c = 0; c <= currentCols; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, canvas.height); ctx.stroke(); }

      // Hover column highlight
      if (hoverCol >= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(hoverCol * CELL, 0, CELL, canvas.height);
        if (nextBall && !board[0][hoverCol]) {
          ctx.globalAlpha = 0.4;
          drawBall(hoverCol, 0, nextBall);
          ctx.globalAlpha = 1;
        }
      }

      // Balls
      for (let r = 0; r < currentRows; r++) {
        for (let c = 0; c < currentCols; c++) {
          if (!board[r][c]) continue;
          const flash = flashing.some(f => f.r === r && f.c === c);
          if (flash) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 22; }
          drawBall(c, r, board[r][c]);
          ctx.shadowBlur = 0;
        }
      }

      // Danger zone top row blink (adventure, low time)
      if (currentMode === 'adventure' && timeLeft > 0 && timeLeft <= 30) {
        ctx.fillStyle = `rgba(255,80,80,${0.06 + 0.04 * Math.sin(Date.now() / 200)})`;
        ctx.fillRect(0, 0, canvas.width, CELL);
      }

      // Paused overlay
      if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏸ PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function drawBall(col, row, lvl) {
      const x = col * CELL + CELL / 2, y = row * CELL + CELL / 2, r = CELL * 0.41;
      const c0 = COLORS[lvl] || '#888';
      const g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r);
      g.addColorStop(0, lighten(c0));
      g.addColorStop(1, c0);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.font = `bold ${Math.round(CELL * .37)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(LABELS[lvl] || lvl, x, y);
    }

    function lighten(hex) {
      let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.min(255, r + 60)},${Math.min(255, g + 60)},${Math.min(255, b + 60)})`;
    }

    /* ── Pause ──────────────────────────────────────────────────────────── */
    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (!gameRunning) return;
      paused = !paused;
      document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
      if (paused) {
        GamePlatform.pause({ board, score, nextBall, timeLeft });
        document.getElementById('hudRow').style.display    = 'none';
        document.getElementById('nextRow').style.display   = 'none';
        document.getElementById('wrap').style.display      = 'none';
        document.getElementById('timerWrap').style.display  = 'none';
        gameRunning = false;
      }
    });

    /* ── Input ──────────────────────────────────────────────────────────── */
    canvas.addEventListener('mousemove', e => {
      const x = e.clientX - canvas.getBoundingClientRect().left;
      hoverCol = Math.min(currentCols - 1, Math.max(0, Math.floor(x / CELL)));
      if (!dead && !paused) draw();
    });
    canvas.addEventListener('mouseleave', () => { hoverCol = -1; if (!dead && !paused) draw(); });
    canvas.addEventListener('click', e => {
      const x = e.clientX - canvas.getBoundingClientRect().left;
      drop(Math.floor(x / CELL));
    });
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      drop(Math.floor(x / CELL));
    }, { passive: false });
  </script>
</body>
